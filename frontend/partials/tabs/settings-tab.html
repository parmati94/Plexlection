<section x-show="activeTab === 'settings'" x-cloak
         class="mx-auto max-w-3xl px-6 py-8 lg:px-10" style="display: none;">

  <div class="mb-7">
    <h2 class="font-display text-display-l font-semibold">Settings</h2>
    <p class="text-body text-ink-muted">
      Connections and tuning live in the database, not the compose file. Env vars
      only seed these on first run.
    </p>
  </div>

  <template x-if="settings">
    <div class="space-y-4">

      <!-- ── Plex ──────────────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <div class="flex items-center justify-between">
          <h3 class="font-display text-body font-semibold text-ink">Plex</h3>
          <span class="rounded-full px-2 py-0.5 text-micro"
                :class="configured.plex ? 'bg-ok-900/40 text-ok-400' : 'bg-raised text-ink-muted'"
                x-text="configured.plex ? 'configured' : 'not configured'"></span>
        </div>

        <div class="mt-3 grid gap-3 sm:grid-cols-2">
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">Server URL</label>
            <input type="text" x-model="settings.plex.url" placeholder="http://192.168.1.10:32400"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
          </div>
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">
              Token
              <span class="text-ink-faint">· X-Plex-Token, not a plex.tv login</span>
            </label>
            <input type="password" x-model="settings.plex.token" autocomplete="off"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body focus:border-accent-500 focus:outline-none" />
          </div>
        </div>

        <div class="mt-3 flex items-center gap-2">
          <button @click="saveConnection('plex')" :disabled="settingsSaving"
                  class="rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
            Save &amp; test
          </button>
          <button @click="testConnection('plex')"
                  class="rounded-lg border border-line-strong px-3 py-1.5 text-body text-ink hover:bg-raised">
            Test connection
          </button>
          <template x-if="connTest.plex">
            <span class="text-body-s"
                  :class="connTest.plex.busy ? 'text-ink-muted'
                          : connTest.plex.ok ? 'text-ok-400' : 'text-danger-400'"
                  x-text="connTest.plex.busy ? 'testing…' : connTest.plex.detail"></span>
          </template>
        </div>

        <!-- Library picker -->
        <template x-if="plexSections.length">
          <div class="mt-4 border-t border-line pt-3">
            <p class="text-body-s text-ink-muted">Libraries to index</p>
            <div class="mt-2 space-y-1.5">
              <template x-for="s in plexSections" :key="s.key">
                <label class="flex items-center gap-2 text-body"
                       :class="s.supported ? 'text-ink' : 'text-ink-faint'">
                  <input type="checkbox" :checked="s.selected" :disabled="!s.supported"
                         @change="toggleLibrary(s.key)"
                         class="rounded border-line-strong bg-raised text-accent-500 focus:ring-accent-500 disabled:opacity-40" />
                  <span x-text="s.title"></span>
                  <span class="text-body-s text-ink-faint" x-text="`${s.type}${s.item_count ? ' · ' + s.item_count : ''}`"></span>
                  <span x-show="!s.supported" class="text-micro text-ink-faint">(movies only in v1)</span>
                </label>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- ── Path mapping ──────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <h3 class="font-display text-body font-semibold text-ink">Media paths</h3>
        <p class="mt-1 text-body-s text-ink-muted">
          Plex reports paths from its own filesystem view. If those differ from what
          this container sees, map them here — otherwise ffprobe can't open your files.
          With no mappings, paths are used as-is.
        </p>

        <!-- Actionable unmapped prefixes -->
        <template x-if="pathHealth?.unmapped?.length">
          <div class="mt-3 rounded-lg border border-warn-600/40 bg-warn-900/20 p-3">
            <p class="text-body-s font-medium text-warn-400">
              <span class="tabular" x-text="unmappedCount + missingCount"></span>
              items have file paths this container can't open
            </p>
            <p class="mt-1 text-micro text-ink-muted">
              Plex reports paths from its own filesystem. Map each prefix below to
              wherever that directory is mounted inside this container — until you
              do, ffprobe can't read anything and file-derived facts stay empty.
            </p>
            <div class="mt-2 space-y-1.5">
              <template x-for="u in pathHealth.unmapped" :key="u.prefix">
                <div class="flex items-center gap-2 text-body-s">
                  <code class="rounded bg-sunken px-1.5 py-0.5 text-ink" x-text="u.prefix"></code>
                  <span class="tabular text-ink-muted" x-text="`${u.count} items`"></span>
                  <button @click="adoptPrefix(u.prefix)"
                          class="ml-auto rounded border border-warn-600/60 px-2 py-0.5 text-warn-400 hover:bg-warn-900/40">
                    Add mapping
                  </button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <div class="mt-3 space-y-2">
          <template x-for="(m, i) in settings.path_mappings" :key="i">
            <div class="flex items-center gap-2">
              <input type="text" x-model="m.plex" placeholder="/data/movies (as Plex sees it)"
                     class="flex-1 rounded-lg border border-line-strong bg-sunken px-2.5 py-1.5 font-mono text-body-s placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
              <span class="text-ink-faint" aria-hidden="true">&rarr;</span>
              <input type="text" x-model="m.local" placeholder="/media/videos/Movies (in this container)"
                     class="flex-1 rounded-lg border border-line-strong bg-sunken px-2.5 py-1.5 font-mono text-body-s placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
              <button @click="removeMapping(i)" class="px-1.5 text-ink-muted hover:text-danger-400"><svg class="icon-sm"><use href="#i-close"/></svg></button>
            </div>
          </template>
        </div>

        <div class="mt-3 flex flex-wrap items-center gap-2">
          <button @click="addMapping()"
                  class="rounded-lg border border-line-strong px-3 py-1.5 text-body text-ink hover:bg-raised">
            + Add mapping
          </button>
          <button @click="testPaths()"
                  class="rounded-lg border border-line-strong px-3 py-1.5 text-body text-ink hover:bg-raised">
            Test
          </button>
          <button @click="savePaths()" :disabled="settingsSaving"
                  class="rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
            Save paths
          </button>
        </div>

        <!-- Test results: resolve unsaved mappings against real files first -->
        <template x-if="pathTest?.results">
          <div class="mt-3 space-y-1 border-t border-line pt-3">
            <template x-for="r in pathTest.results" :key="r.plex_path">
              <div class="flex items-start gap-2 font-mono text-micro">
                <span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full"
                      :class="r.exists ? 'bg-ok-500' : r.mapped ? 'bg-warn-500' : 'bg-danger-500'"></span>
                <div class="min-w-0">
                  <p class="truncate text-ink-muted" x-text="r.plex_path"></p>
                  <p class="truncate" :class="r.exists ? 'text-ok-400' : 'text-danger-400'"
                     x-text="r.local_path ?? 'no mapping matched'"></p>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- ── TMDB ──────────────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <div class="flex items-center justify-between">
          <h3 class="font-display text-body font-semibold text-ink">TMDB</h3>
          <span class="rounded-full px-2 py-0.5 text-micro"
                :class="configured.tmdb ? 'bg-ok-900/40 text-ok-400' : 'bg-raised text-ink-muted'"
                x-text="configured.tmdb ? 'configured' : 'optional'"></span>
        </div>
        <p class="mt-1 text-body-s text-ink-muted">
          Adds keywords, franchise, budget/box office and the official runtime —
          which is what makes extended-cut detection possible.
          <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener"
             class="text-accent-400 hover:underline">Get a free key</a>.
        </p>
        <div class="mt-3 grid gap-3 sm:grid-cols-[2fr_1fr]">
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">API key (v3)</label>
            <input type="password" x-model="settings.tmdb.api_key" autocomplete="off"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body focus:border-accent-500 focus:outline-none" />
          </div>
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">Language</label>
            <input type="text" x-model="settings.tmdb.language" placeholder="en-US"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
          </div>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <button @click="saveConnection('tmdb')" :disabled="settingsSaving"
                  class="rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
            Save &amp; test
          </button>
          <template x-if="connTest.tmdb">
            <span class="text-body-s"
                  :class="connTest.tmdb.busy ? 'text-ink-muted'
                          : connTest.tmdb.ok ? 'text-ok-400' : 'text-danger-400'"
                  x-text="connTest.tmdb.busy ? 'testing…' : connTest.tmdb.detail"></span>
          </template>
        </div>
      </div>

      <!-- ── Tautulli ──────────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <div class="flex items-center justify-between">
          <h3 class="font-display text-body font-semibold text-ink">Tautulli</h3>
          <span class="rounded-full px-2 py-0.5 text-micro"
                :class="configured.tautulli ? 'bg-ok-900/40 text-ok-400' : 'bg-raised text-ink-muted'"
                x-text="configured.tautulli ? 'configured' : 'optional'"></span>
        </div>
        <p class="mt-1 text-body-s text-ink-muted">
          Watch history: never played, started-and-abandoned, rewatch candidates.
        </p>
        <div class="mt-3 grid gap-3 sm:grid-cols-2">
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">URL</label>
            <input type="text" x-model="settings.tautulli.url" placeholder="http://192.168.1.10:8181"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
          </div>
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">API key</label>
            <input type="password" x-model="settings.tautulli.api_key" autocomplete="off"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body focus:border-accent-500 focus:outline-none" />
          </div>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <button @click="saveConnection('tautulli')" :disabled="settingsSaving"
                  class="rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
            Save &amp; test
          </button>
          <template x-if="connTest.tautulli">
            <span class="text-body-s"
                  :class="connTest.tautulli.busy ? 'text-ink-muted'
                          : connTest.tautulli.ok ? 'text-ok-400' : 'text-danger-400'"
                  x-text="connTest.tautulli.busy ? 'testing…' : connTest.tautulli.detail"></span>
          </template>
        </div>
      </div>

      <!-- ── Schedule ──────────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <h3 class="font-display text-body font-semibold text-ink">Schedule</h3>
        <label class="mt-2 flex items-center gap-2 text-body text-ink-muted">
          <input type="checkbox" x-model="settings.schedule.enabled"
                 class="rounded border-line-strong bg-raised text-accent-500 focus:ring-accent-500" />
          Run scans and syncs automatically
        </label>
        <p class="mt-1 text-body-s text-ink-faint">
          Standard cron expressions. Scheduled syncs obey the dry-run setting above,
          so nothing writes to Plex until you've armed it.
        </p>
        <div class="mt-3 space-y-2">
          <template x-for="j in [
              {k:'scan_incremental', l:'Incremental scan', h:'Plex + ffprobe + APIs on stale items'},
              {k:'scan_deep', l:'Deep scan', h:'also runs expensive providers'},
              {k:'sync_all', l:'Sync all rules', h:'reconcile every enabled rule'}]" :key="j.k">
            <div class="flex items-center gap-2">
              <div class="w-40 shrink-0">
                <p class="text-body-s text-ink" x-text="j.l"></p>
                <p class="text-micro text-ink-faint" x-text="j.h"></p>
              </div>
              <input type="text" x-model="settings.schedule[j.k]" placeholder="0 4 * * *"
                     class="w-32 rounded-lg border border-line-strong bg-sunken px-2 py-1 font-mono text-body-s placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
              <span class="text-micro text-ink-faint"
                    x-text="scheduleJobs.find(x => x.id === j.k)?.next_run
                            ? 'next: ' + new Date(scheduleJobs.find(x => x.id === j.k).next_run).toLocaleString()
                            : (settings.schedule.enabled ? '—' : 'disabled')"></span>
            </div>
          </template>
        </div>
        <button @click="saveSchedule()" :disabled="settingsSaving"
                class="mt-3 rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
          Save schedule
        </button>
      </div>

      <!-- ── Scan tuning ───────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <h3 class="font-display text-body font-semibold text-ink">Scanning</h3>
        <div class="mt-3 grid gap-3 sm:grid-cols-2">
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">ffprobe concurrency</label>
            <input type="number" min="1" max="16" x-model.number="settings.scan.concurrency.ffprobe"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body focus:border-accent-500 focus:outline-none" />
          </div>
          <div>
            <label class="mb-1 block text-body-s text-ink-muted">ffprobe timeout (s)</label>
            <input type="number" min="5" max="600" x-model.number="settings.scan.ffprobe_timeout_s"
                   class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body focus:border-accent-500 focus:outline-none" />
          </div>
        </div>
        <label class="mt-3 flex items-start gap-2 text-body text-ink-muted">
          <input type="checkbox" x-model="settings.scan.deep_fingerprint"
                 class="mt-0.5 rounded border-line-strong bg-raised text-accent-500 focus:ring-accent-500" />
          <span>
            Deep fingerprinting
            <span class="block text-body-s text-ink-faint">
              Also hashes the first and last 1&nbsp;MiB, catching file replacements that
              preserved size and mtime. Costs a seek plus 2&nbsp;MiB per item per scan.
            </span>
          </span>
        </label>
        <button @click="saveSettings({ scan: settings.scan })" :disabled="settingsSaving"
                class="mt-3 rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
          Save
        </button>
      </div>

      <!-- ── Safety ────────────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <h3 class="font-display text-body font-semibold text-ink">Safety</h3>
        <label class="mt-3 flex items-start gap-2 text-body text-ink-muted">
          <input type="checkbox" x-model="settings.safety.dry_run"
                 class="mt-0.5 rounded border-line-strong bg-raised text-accent-500 focus:ring-accent-500" />
          <span>
            Dry run
            <span class="block text-body-s text-ink-faint">
              Nothing is written to Plex while this is on. Leave it on until you've
              seen a diff you're happy with.
            </span>
          </span>
        </label>
        <button @click="saveSettings({ safety: settings.safety })" :disabled="settingsSaving"
                class="mt-3 rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
          Save
        </button>
      </div>

      <!-- ── Appearance ────────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <h3 class="font-display text-body font-semibold text-ink">Appearance</h3>
        <div class="mt-3 flex flex-wrap gap-2">
          <template x-for="t in themes" :key="t.id">
            <button @click="applyTheme(t.id)"
                    class="flex items-center gap-2 rounded-lg border px-3 py-1.5 text-body transition-colors"
                    :class="theme === t.id
                      ? 'border-accent-500 bg-accent-500/10 text-ink'
                      : 'border-line-strong text-ink-muted hover:bg-raised'">
              <span class="h-3 w-3 rounded-full" :style="`background:${t.swatch}`"></span>
              <span x-text="t.label"></span>
            </button>
          </template>
        </div>
        <label class="mt-4 flex items-center gap-2 text-body text-ink-muted">
          <input type="checkbox" :checked="reduceMotion" @change="setReduceMotion($event.target.checked)"
                 class="rounded border-line-strong bg-raised text-accent-500 focus:ring-accent-500" />
          Reduce motion
        </label>
      </div>

      <!-- ── Runtime ───────────────────────────────────────────────────── -->
      <div class="rounded-xl border border-line bg-surface p-5">
        <h3 class="font-display text-body font-semibold text-ink">Runtime</h3>
        <dl class="mt-3 grid grid-cols-2 gap-x-6 gap-y-2 text-body">
          <dt class="text-ink-muted">Backend</dt>
          <dd :class="health?.status === 'healthy' ? 'text-ok-400' : 'text-danger-400'"
              x-text="health?.status ?? 'unknown'"></dd>
          <dt class="text-ink-muted">Items indexed</dt>
          <dd class="tabular text-ink" x-text="itemCount"></dd>
          <dt class="text-ink-muted">Live updates</dt>
          <dd :class="sseConnected ? 'text-ok-400' : 'text-ink-muted'"
              x-text="sseConnected ? 'connected' : 'disconnected'"></dd>
        </dl>
      </div>
    </div>
  </template>
</section>
