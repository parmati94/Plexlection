<section x-show="activeTab === 'rules'" x-cloak
         class="mx-auto max-w-[92rem] px-6 py-8 lg:px-10" style="display: none;">

  <div class="mb-7 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h2 class="font-display text-display-l font-semibold">Rules</h2>
      <p class="text-body text-ink-muted">
        Conditions over any known fact. The filters below are generated from the
        fact registry, so every provider you add appears here automatically.
      </p>
    </div>
    <button @click="newRule()"
            class="rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500">
      + New rule
    </button>
  </div>

  <div class="grid gap-4 lg:grid-cols-[18rem_1fr]">

    <!-- Rule list -->
    <aside class="space-y-1.5">
      <template x-if="!rules.length">
        <p class="rounded-xl border border-dashed border-line bg-surface/50 px-4 py-8 text-center text-body text-ink-muted">
          No rules yet.
        </p>
      </template>
      <template x-for="r in rules" :key="r.id">
        <div @click="editRule(r.id)"
             class="cursor-pointer rounded-lg border px-3 py-2 transition-colors"
             :class="editingRule?.id === r.id
               ? 'border-accent-500 bg-accent-500/10'
               : 'border-line bg-surface hover:bg-raised/70'">
          <div class="flex items-center gap-2">
            <span class="h-1.5 w-1.5 rounded-full"
                  :class="r.enabled ? 'bg-ok-500' : 'bg-line-strong'"></span>
            <p class="truncate text-body font-medium text-ink" x-text="r.name"></p>
            <button @click.stop="deleteRule(r.id, r.name)"
                    class="ml-auto text-ink-faint hover:text-danger-400"><svg class="icon-sm"><use href="#i-close"/></svg></button>
          </div>
          <p class="mt-0.5 truncate font-mono text-micro text-ink-faint"
             x-text="`plexlection:${r.slug}`"></p>
          <p x-show="r.last_match_count !== null" class="tabular text-micro text-ink-muted"
             x-text="`${r.last_match_count} matched`"></p>
        </div>
      </template>
    </aside>

    <!-- Editor -->
    <div>
      <template x-if="!editingRule">
        <div class="rounded-xl border border-dashed border-line bg-surface/50 px-6 py-16 text-center">
          <svg class="mx-auto h-8 w-8 text-ink-faint"><use href="#i-rules"/></svg>
          <p class="mt-3 font-display text-title font-semibold text-ink">Build a rule</p>
          <p class="mx-auto mt-1 max-w-md text-body text-ink-muted">
            Pick a fact, an operator and a value. The match count updates as you type.
          </p>
          <button @click="newRule()"
                  class="mt-4 rounded-lg bg-accent-600 px-4 py-2 text-body font-medium text-white hover:bg-accent-500">
            New rule
          </button>
        </div>
      </template>

      <template x-if="editingRule">
        <div class="space-y-4">

          <!-- Name / meta -->
          <div class="rounded-xl border border-line bg-surface p-5">
            <div class="grid gap-3 sm:grid-cols-[2fr_1fr]">
              <div>
                <label class="mb-1 block text-body-s text-ink-muted">Rule name</label>
                <input type="text" x-model="editingRule.name" @input="ruleDirty = true"
                       placeholder="Ultrawide scope"
                       class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
              </div>
              <div>
                <label class="mb-1 block text-body-s text-ink-muted">Limit (optional)</label>
                <input type="number" min="1" x-model.number="editingRule.limit_n"
                       @input="touchRule()" placeholder="all"
                       class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
              </div>
            </div>

            <div class="mt-3 grid gap-3 sm:grid-cols-2">
              <div>
                <label class="mb-1 block text-body-s text-ink-muted">Order by</label>
                <select x-model="editingRule.order_by_key" @change="touchRule()"
                        class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body focus:border-accent-500 focus:outline-none">
                  <option :value="null">Title</option>
                  <option value="year">Year</option>
                  <option value="added_at">Date added</option>
                  <option value="size">File size</option>
                  <option value="random">Random</option>
                  <!-- Same unit-qualified labels as the condition rows; "Runtime"
                       alone is ambiguous across three facts here too. -->
                  <template x-for="f in sortableFacts()" :key="f.key">
                    <option :value="f.key" :selected="f.key === editingRule.order_by_key"
                            x-text="f.optionLabel"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="mb-1 block text-body-s text-ink-muted">Direction</label>
                <select x-model="editingRule.order_dir" @change="touchRule()"
                        class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2.5 text-body focus:border-accent-500 focus:outline-none">
                  <option value="desc">Descending</option>
                  <option value="asc">Ascending</option>
                </select>
              </div>
            </div>
          </div>

          <!-- The tree -->
          <div class="rounded-xl border border-line bg-surface p-5">
            <div class="mb-1 flex items-center justify-between">
              <h3 class="font-display text-body font-semibold text-ink">Conditions</h3>
              <button @click="explainRule()"
                      class="text-micro text-ink-muted hover:text-ink"
                      title="Show the generated SQL and its query plan">
                Explain SQL
              </button>
            </div>
            <p class="mb-3 text-micro text-ink-faint">
              Click the <span class="rounded bg-raised px-1 font-bold text-ink-muted">AND</span>
              between conditions to switch the whole group to
              <span class="rounded bg-accent-500/20 px-1 font-bold text-accent-300">OR</span>.
              For mixed logic — <em>scope AND (Dolby&nbsp;Vision OR HDR10)</em> — add a
              nested group and give it the opposite operator.
            </p>
            {{> rule-node }}
          </div>

          <!-- Preview -->
          <div class="rounded-xl border border-line bg-surface p-5">
            <div class="flex flex-wrap items-baseline gap-3">
              <h3 class="font-display text-body font-semibold text-ink">Preview</h3>
              <template x-if="preview">
                <p class="text-body">
                  <span class="tabular font-display text-display-l font-semibold text-accent-400"
                        x-text="preview.matched"></span>
                  <span class="text-ink-muted"
                        x-text="`of ${preview.in_scope} items match`"></span>
                  <span x-show="editingRule.limit_n && preview.collection_size < preview.matched"
                        class="text-ink-muted"
                        x-text="`· collection capped at ${preview.collection_size}`"></span>
                </p>
              </template>
              <span x-show="previewLoading" class="text-body-s text-ink-faint">updating…</span>
              <button @click="saveRule()"
                      class="ml-auto rounded-lg bg-accent-600 px-3 py-1.5 text-body font-medium text-white hover:bg-accent-500">
                <span x-text="editingRule.id ? 'Save changes' : 'Create rule'"></span>
              </button>
              <button @click="closeEditor()"
                      class="rounded-lg border border-line-strong px-3 py-1.5 text-body text-ink hover:bg-raised">
                Close
              </button>
            </div>

            <p x-show="previewHint" x-cloak
               class="mt-3 rounded-lg bg-raised px-3 py-2 text-body-s text-ink-muted"
               x-text="previewHint" style="display: none;"></p>

            <p x-show="previewError" x-cloak
               class="mt-3 rounded-lg bg-danger-900/30 px-3 py-2 text-body-s text-danger-400"
               x-text="previewError" style="display: none;"></p>

            <!-- Coverage warning: a rule can look wrong when it's really just
                 filtering on facts that haven't been computed yet. -->
            <p x-show="preview?.stale" x-cloak
               class="mt-3 rounded-lg bg-warn-900/25 px-3 py-2 text-body-s text-warn-400"
               style="display: none;">
              <span class="tabular" x-text="preview?.stale"></span>
              items are missing facts this rule depends on
              (<span x-text="preview?.depends_on?.join(', ')"></span>).
              <button @click="setTab('scan')" class="underline hover:no-underline">Run a scan</button>
              to fill them in.
            </p>

            <template x-if="preview?.sample?.length">
              <div class="mt-3 overflow-hidden rounded-lg border border-line">
                <table class="w-full text-body-s">
                  <tbody class="divide-y divide-line">
                    <template x-for="s in preview.sample" :key="s.id">
                      <tr class="bg-sunken/60">
                        <td class="px-4 py-2.5 text-ink" x-text="s.title"></td>
                        <td class="tabular px-4 py-2.5 text-right text-ink-faint" x-text="s.year ?? ''"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>

          <!-- Explain output -->
          <template x-if="explain">
            <div class="rounded-xl border border-line bg-sunken p-4">
              <div class="mb-2 flex items-center justify-between">
                <h3 class="font-display text-body font-semibold text-ink">Generated SQL</h3>
                <button @click="explain = null" class="text-ink-faint hover:text-ink"><svg class="icon-sm"><use href="#i-close"/></svg></button>
              </div>
              <pre class="app-scroll overflow-x-auto whitespace-pre-wrap break-words font-mono text-micro text-ink-muted"
                   x-text="explain.sql"></pre>
              <p class="mt-2 font-mono text-micro text-ink-faint"
                 x-text="`params: ${JSON.stringify(explain.params)}`"></p>
              <div class="mt-2 border-t border-line pt-2">
                <template x-for="(p, i) in explain.plan" :key="i">
                  <p class="font-mono text-micro"
                     :class="String(p.detail).includes('SCAN') && !String(p.detail).includes('USING')
                             ? 'text-warn-400' : 'text-ink-muted'"
                     x-text="p.detail"></p>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</section>
