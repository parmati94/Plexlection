<!-- Flattened rule tree.

     Alpine can't render a component recursively, so the tree is flattened in
     ruleBuilder.js into a depth-first array and drawn by a single x-for, with
     indentation from `depth`. A side benefit: drag-to-reorder becomes feasible
     later, which a recursive template would make painful. -->

<div class="space-y-1">
  <template x-for="n in ruleFlatNodes" :key="n.id">
    <div class="flex flex-wrap items-center gap-1.5 rounded-md py-1"
         :style="`margin-left:${n.depth * 1.25}rem`">

      <!-- Joiner. Sits between siblings and IS the AND/OR control — putting it
           only on the group header made every rule read as an AND, because
           nothing between the conditions said otherwise. -->
      <template x-if="n.index > 0 && n.parentType">
        <button @click="toggleGroupOp(n.parentId)"
                class="-ml-1 w-11 shrink-0 rounded px-1 py-0.5 text-micro font-bold tracking-wide transition-colors"
                :class="n.parentType === 'or'
                  ? 'bg-accent-500/20 text-accent-300 hover:bg-accent-500/30'
                  : 'bg-raised text-ink-muted hover:bg-overlay'"
                :title="n.parentType === 'and'
                  ? 'Every condition must match — click for ANY'
                  : 'Any one condition may match — click for ALL'"
                x-text="n.parentType === 'and' ? 'AND' : 'OR'"></button>
      </template>
      <span x-show="n.index === 0 && n.parentType" class="w-11 shrink-0"></span>

      <!-- Group node -->
      <template x-if="n.type === 'and' || n.type === 'or'">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-body-s text-ink-muted">Match</span>
          <div class="inline-flex overflow-hidden rounded-md border border-line-strong">
            <button @click="setGroupOp(n.id, 'and')"
                    class="px-2 py-0.5 text-body-s font-medium transition-colors"
                    :class="n.type === 'and' ? 'bg-accent-600 text-white' : 'text-ink-muted hover:bg-raised'">
              ALL
            </button>
            <button @click="setGroupOp(n.id, 'or')"
                    class="px-2 py-0.5 text-body-s font-medium transition-colors"
                    :class="n.type === 'or' ? 'bg-accent-600 text-white' : 'text-ink-muted hover:bg-raised'">
              ANY
            </button>
          </div>
          <span class="text-body-s text-ink-muted">of:</span>

          <button @click="addCondition(n.id)"
                  class="ml-1 rounded border border-line-strong px-1.5 py-0.5 text-micro text-ink-muted hover:bg-raised">
            + condition
          </button>
          <button @click="addGroup(n.id)"
                  class="rounded border border-line-strong px-1.5 py-0.5 text-micro text-ink-muted hover:bg-raised"
                  title="A nested group can use the opposite operator — e.g. scope AND (Dolby Vision OR HDR10)">
            + group
          </button>
          <button x-show="n.depth > 0" @click="removeNode(n.id)"
                  class="px-1 text-ink-faint hover:text-danger-400"><svg class="icon-sm"><use href="#i-close"/></svg></button>
        </div>
      </template>

      <!-- NOT wrapper -->
      <template x-if="n.type === 'not'">
        <div class="flex items-center gap-1.5">
          <span class="rounded bg-danger-900/40 px-1.5 py-0.5 text-micro font-medium text-danger-400">NOT</span>
          <button @click="unwrapNot(n.id)"
                  class="text-micro text-ink-faint hover:text-ink"
                  title="Remove the NOT, keep the condition">unwrap</button>
        </div>
      </template>

      <!-- Condition leaf (a plain value comparison, or one against a library
           aggregate — "top 10% played" is `>= library percentile 90`) -->
      <template x-if="n.type === 'cmp' || n.type === 'agg_cmp'">
        <div class="flex flex-wrap items-center gap-1.5">

          <!-- Fact picker: searchable combobox over the whole registry,
               grouped by namespace. Replaced the native <select> once the
               registry passed a hundred facts — scrolling an optgroup list
               that long is how conditions were picked by accident. -->
          <div x-data="combobox({
                 label: () => factLabel(n.node.key),
                 groups: (q) => factSearchGroups(q),
                 select: (f) => { n.node.key = f.key; onFactChange(n.id); },
                 isCurrent: (f) => f.key === n.node.key,
                 placeholder: 'Search facts…',
               })">{{> combobox }}</div>

          <!-- Operators, straight from the registry — never hardcoded. An
               aggregate comparison uses the fixed gt/gte/lt/lte set instead. -->
          <select @change="n.node.op = $event.target.value; onOpChange(n.id)"
                  class="rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s focus:border-accent-500 focus:outline-none">
            <template x-for="o in (n.node.type === 'agg_cmp' ? aggOps() : operatorsFor(n.node.key))" :key="o.op">
              <option :value="o.op" :selected="o.op === n.node.op" x-text="o.label"></option>
            </template>
          </select>

          <!-- Compare against a value, or against the library itself.
               Only offered where an aggregate is meaningful. -->
          <template x-if="isAggable(n.node.key)">
            <select @change="setCompareMode(n.id, $event.target.value)"
                    class="rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s text-ink-muted focus:border-accent-500 focus:outline-none">
              <option value="value" :selected="n.node.type === 'cmp'">a value</option>
              <template x-for="a in aggregates()" :key="a.agg">
                <option :value="a.agg"
                        :selected="n.node.type === 'agg_cmp' && n.node.agg === a.agg"
                        x-text="a.label"></option>
              </template>
            </select>
          </template>

          <template x-if="n.node.type === 'agg_cmp' && n.node.agg === 'percentile'">
            <div class="flex items-center gap-1.5">
              <div class="flex items-stretch overflow-hidden rounded-md border border-line-strong bg-sunken focus-within:border-accent-500">
                <input type="number" min="0" max="100" step="1"
                       :value="n.node.agg_arg"
                       @input="n.node.agg_arg = $event.target.value === '' ? null : Number($event.target.value); touchRule()"
                       class="w-16 bg-transparent px-2 py-1 text-body-s focus:outline-none" />
                <span class="flex items-center border-l border-line bg-raised px-2 text-micro text-ink-muted">th</span>
              </div>
              <span class="text-micro text-ink-faint" x-text="aggHint(n.node)"></span>
            </div>
          </template>

          <!-- Value editor, switched on the operator's declared value_kind -->
          <!-- Number input carries its unit. Storage stays canonical; only the
               box scales, so "2 hours" is 120 min here and 7200 s in the rule. -->
          <template x-if="valueKind(n.node) === 'number'">
            <div class="flex items-stretch overflow-hidden rounded-md border border-line-strong bg-sunken focus-within:border-accent-500"
                 :title="unitHint(n.node.key)">
              <input type="number" :step="unitFor(n.node.key)?.step ?? 'any'"
                     :value="numberIn(n.node)"
                     @input="setNumberIn(n.node, $event.target.value)"
                     class="w-24 bg-transparent px-2 py-1 text-body-s focus:outline-none" />
              <template x-if="unitFor(n.node.key)">
                <span class="flex items-center border-l border-line bg-raised px-2 text-micro text-ink-muted"
                      x-text="unitFor(n.node.key).suffix"></span>
              </template>
            </div>
          </template>

          <template x-if="valueKind(n.node) === 'text'">
            <input type="text" x-model="n.node.value" @input="touchRule()"
                   class="w-40 rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s focus:border-accent-500 focus:outline-none" />
          </template>

          <template x-if="valueKind(n.node) === 'date'">
            <input type="date" x-model="n.node.value" @change="touchRule()"
                   class="rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s focus:border-accent-500 focus:outline-none" />
          </template>

          <template x-if="valueKind(n.node) === 'enum' && opArity(n.node) === 1">
            <select @change="n.node.value = $event.target.value; touchRule()"
                    class="rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s focus:border-accent-500 focus:outline-none">
              <option value="" :selected="!n.node.value">—</option>
              <template x-for="v in (specFor(n.node.key)?.enum_values ?? [])" :key="v">
                <option :value="v" :selected="v === n.node.value" x-text="v"></option>
              </template>
            </select>
          </template>

          <!-- Multi-value: enum or free text, rendered as removable chips -->
          <template x-if="opArity(n.node) === 'n'">
            <div class="flex flex-wrap items-center gap-1">
              <template x-for="v in listValue(n.node)" :key="v">
                <span class="inline-flex items-center gap-1 rounded bg-accent-500/15 px-1.5 py-0.5 text-micro text-accent-300">
                  <span x-text="v"></span>
                  <button @click="removeListValue(n.id, v)" class="hover:text-white"><svg class="icon-sm"><use href="#i-close"/></svg></button>
                </span>
              </template>
              <template x-if="specFor(n.node.key)?.enum_values">
                <select @change="addListValue(n.id, $event.target.value); $event.target.value = ''"
                        class="rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s focus:border-accent-500 focus:outline-none">
                  <option value="">+ add…</option>
                  <template x-for="v in specFor(n.node.key).enum_values" :key="v">
                    <option :value="v" x-text="v"></option>
                  </template>
                </select>
              </template>
              <!-- Same suggestions for the multi-value editor. This is where
                   "includes any of [custom formats]" is built, so guessing the
                   exact spelling of a Trash Guides format was the difference
                   between the rule working and silently matching nothing.
                   A styled dropdown rather than a <datalist>: the native popup
                   is unstylable and, with a large vocabulary, fills the whole
                   screen. Stays open after a pick — adding several is the
                   normal flow here. -->
              <template x-if="!specFor(n.node.key)?.enum_values">
                <div class="relative" x-data="{ open: false, q: '' }" @click.outside="open = false">
                  <input type="text" placeholder="+ add…" x-ref="addInput"
                         @focus="suggestValues(n.node.key); open = true"
                         @input="q = $event.target.value; open = true"
                         @keydown.escape="open = false"
                         @keydown.enter.prevent="addListValue(n.id, $event.target.value); $event.target.value = ''; q = ''"
                         class="w-28 rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
                  <div x-show="open && suggestFiltered(n.node.key, q).length" style="display: none;"
                       class="absolute left-0 top-full z-30 mt-1 max-h-56 w-64 overflow-y-auto rounded-lg border border-line-strong bg-surface py-1 shadow-2xl">
                    <template x-for="s in suggestFiltered(n.node.key, q)" :key="s.value">
                      <button @click="addListValue(n.id, s.value); $refs.addInput.value = ''; q = ''"
                              class="flex w-full items-baseline justify-between gap-3 px-2.5 py-1 text-left text-body-s text-ink hover:bg-raised">
                        <span class="truncate" x-text="s.value"></span>
                        <span class="shrink-0 text-micro text-ink-faint"
                              x-text="s.count ? s.count : 'new'"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Range -->
          <!-- Range. Both halves convert through the same adapter, so the unit
               is stated once at the end rather than repeated on each box. -->
          <template x-if="opArity(n.node) === 2">
            <div class="flex items-center gap-1.5" :title="unitHint(n.node.key)">
              <input type="number" :step="unitFor(n.node.key)?.step ?? 'any'"
                     :value="rangeIn(n.node, 0)"
                     @input="setRangeIn(n.node, 0, $event.target.value)"
                     class="w-20 rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s focus:border-accent-500 focus:outline-none" />
              <span class="text-body-s text-ink-faint">and</span>
              <div class="flex items-stretch overflow-hidden rounded-md border border-line-strong bg-sunken focus-within:border-accent-500">
                <input type="number" :step="unitFor(n.node.key)?.step ?? 'any'"
                       :value="rangeIn(n.node, 1)"
                       @input="setRangeIn(n.node, 1, $event.target.value)"
                       class="w-20 bg-transparent px-2 py-1 text-body-s focus:outline-none" />
                <template x-if="unitFor(n.node.key)">
                  <span class="flex items-center border-l border-line bg-raised px-2 text-micro text-ink-muted"
                        x-text="unitFor(n.node.key).suffix"></span>
                </template>
              </div>
            </div>
          </template>

          <!-- Suggest: typeahead over values present in the library, plus any
               controlled vocabulary the owning provider publishes. A styled
               dropdown rather than a <datalist> — the native popup is
               unstylable and, with a large vocabulary, fills the screen. -->
          <template x-if="valueKind(n.node) === 'suggest' && opArity(n.node) === 1">
            <div class="relative" x-data="{ open: false }" @click.outside="open = false">
              <input type="text" x-model="n.node.value" placeholder="value"
                     @focus="suggestValues(n.node.key); open = true"
                     @input="open = true; touchRule()"
                     @keydown.escape="open = false"
                     class="w-40 rounded-md border border-line-strong bg-sunken px-2 py-1 text-body-s placeholder-ink-faint focus:border-accent-500 focus:outline-none" />
              <div x-show="open && suggestFiltered(n.node.key, n.node.value).length" style="display: none;"
                   class="absolute left-0 top-full z-30 mt-1 max-h-56 w-64 overflow-y-auto rounded-lg border border-line-strong bg-surface py-1 shadow-2xl">
                <template x-for="s in suggestFiltered(n.node.key, n.node.value)" :key="s.value">
                  <button @click="n.node.value = s.value; open = false; touchRule()"
                          class="flex w-full items-baseline justify-between gap-3 px-2.5 py-1 text-left text-body-s text-ink hover:bg-raised">
                    <span class="truncate" x-text="s.value"></span>
                    <span class="shrink-0 text-micro text-ink-faint"
                          x-text="s.count ? s.count : 'new'"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>

          <span x-show="coverageNote(n.node.key)" class="text-micro text-warn-500"
                x-text="coverageNote(n.node.key)"
                title="Items missing this fact can't match — run a scan"></span>

          <button @click="wrapInNot(n.id)"
                  class="rounded border border-line-strong px-1.5 py-0.5 text-micro text-ink-muted hover:bg-raised"
                  title="Negate this condition">not</button>
          <button @click="removeNode(n.id)" class="px-1 text-ink-faint hover:text-danger-400"><svg class="icon-sm"><use href="#i-close"/></svg></button>
        </div>
      </template>
    </div>
  </template>
</div>
