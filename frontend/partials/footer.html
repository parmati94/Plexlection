<!-- Global error banner -->
<div x-show="error" x-cloak class="border-b border-danger-600/50 bg-danger-900/30" style="display: none;">
  <div class="mx-auto flex max-w-[92rem] items-center gap-3 px-4 py-2 text-body">
    <svg class="icon-sm shrink-0"><use href="#i-alert"/></svg>
    <span class="text-danger-400" x-text="error"></span>
    <button @click="error = null" class="ml-auto text-ink-muted hover:text-ink"><svg class="icon-sm"><use href="#i-close"/></svg></button>
  </div>
</div>

  <!-- Global toast -->
  <div x-show="toast"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed bottom-4 right-4 z-[9999] max-w-sm" style="display: none;">
    <div class="rounded-lg border px-4 py-3 shadow-2xl"
         :class="toast?.ok ? 'bg-ok-900/90 border-ok-600 text-ok-400'
                 : toast?.warn ? 'bg-warn-900/90 border-warn-600 text-warn-400'
                               : 'bg-danger-900/90 border-danger-600 text-danger-400'">
      <div class="flex items-start gap-3">
        <p class="text-body text-ink" x-text="toast?.message"></p>
        <button @click="toast = null" class="ml-auto text-ink-muted hover:text-ink"><svg class="icon-sm"><use href="#i-close"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Promise-based confirm dialog -->
  <div x-show="confirmDialog.show" x-cloak
       @click.self="confirmDialogCancel()"
       class="fixed inset-0 z-[9998] flex items-center justify-center bg-black/70 p-4"
       style="display: none;">
    <div @click.stop class="w-full max-w-md rounded-xl border border-line-strong bg-raised p-5 shadow-2xl">
      <h3 class="font-display text-title font-bold" x-text="confirmDialog.title"></h3>
      <p class="mt-2 whitespace-pre-line text-body text-ink-muted" x-text="confirmDialog.message"></p>
      <div class="mt-5 flex justify-end gap-2">
        <button @click="confirmDialogCancel()"
                class="rounded-lg border border-line-strong px-3 py-1.5 text-body text-ink hover:bg-overlay">
          Cancel
        </button>
        <button @click="confirmDialogAccept()"
                class="rounded-lg px-3 py-1.5 text-body font-medium text-white"
                :class="confirmDialog.danger ? 'bg-danger-600 hover:bg-danger-500'
                                             : 'bg-accent-600 hover:bg-accent-500'"
                x-text="confirmDialog.confirmLabel"></button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
