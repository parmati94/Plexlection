<!-- Item detail drawer.
     This is the debugging surface: when a fact looks wrong, it shows which
     provider produced it, when, and whether the file has changed since. -->
<div x-show="itemDrawer.open" x-cloak
     @click.self="closeItem()"
     @keydown.escape.window="closeItem()"
     class="fixed inset-0 z-50 flex justify-end bg-black/60"
     style="display: none;">

  <div @click.stop
       x-show="itemDrawer.open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="translate-x-full"
       class="app-scroll h-full w-full max-w-xl overflow-y-auto border-l border-line bg-surface p-5">

    <div class="mb-4 flex items-start justify-between gap-4">
      <div class="min-w-0">
        <h3 class="font-display text-title font-bold" x-text="itemDrawer.item?.title ?? 'Loading…'"></h3>
        <p class="text-body text-ink-muted">
          <span x-text="itemDrawer.item?.year ?? ''"></span>
          <span x-show="itemDrawer.item?.tmdb_id" class="text-ink-faint">
            · TMDB <span x-text="itemDrawer.item?.tmdb_id"></span>
          </span>
        </p>
      </div>
      <div class="flex items-center gap-3">
        <template x-if="itemDrawer.item?.facts?.video?.dar">
          <div class="flex flex-col items-center gap-1 text-accent-400">
            <div class="ar-glyph-lg" :style="`--ar:${itemDrawer.item.facts.video.dar}`"></div>
            <span class="font-mono text-micro text-ink-faint"
                  x-text="itemDrawer.item.facts.video.aspect_bucket ?? ''"></span>
          </div>
        </template>
        <button @click="closeItem()" class="text-ink-muted hover:text-ink"><svg class="icon-sm"><use href="#i-close"/></svg></button>
      </div>
    </div>

    <template x-if="itemDrawer.item">
      <div class="space-y-4">

        <!-- File -->
        <div class="rounded-lg border border-line bg-sunken p-3">
          <p class="mb-2 text-body-s uppercase tracking-wide text-ink-muted">File</p>
          <dl class="space-y-1.5 text-body-s">
            <div>
              <dt class="text-ink-muted">Plex path</dt>
              <dd class="break-all font-mono text-ink-muted" x-text="itemDrawer.item.plex_path ?? '—'"></dd>
            </div>
            <div>
              <dt class="text-ink-muted">Container path</dt>
              <dd class="break-all font-mono"
                  :class="itemDrawer.item.path_status === 'mapped' ? 'text-ok-400' : 'text-danger-400'"
                  x-text="itemDrawer.item.local_path ?? 'not mapped'"></dd>
            </div>
            <div class="flex gap-6">
              <div>
                <dt class="text-ink-muted">Size</dt>
                <dd class="tabular text-ink-muted" x-text="formatBytes(itemDrawer.item.file_size)"></dd>
              </div>
              <div>
                <dt class="text-ink-muted">Added</dt>
                <dd class="tabular text-ink-muted" x-text="formatDate(itemDrawer.item.plex_added_at)"></dd>
              </div>
              <div>
                <dt class="text-ink-muted">Status</dt>
                <dd x-text="itemDrawer.item.path_status"
                    :class="itemDrawer.item.path_status === 'mapped' ? 'text-ok-400' : 'text-warn-400'"></dd>
              </div>
            </div>
          </dl>
        </div>

        <!-- Provenance -->
        <div class="rounded-lg border border-line bg-sunken p-3">
          <p class="mb-2 text-body-s uppercase tracking-wide text-ink-muted">Providers</p>
          <template x-if="!itemDrawer.provenance.length">
            <p class="text-body-s text-ink-faint">No provider has run against this item yet.</p>
          </template>
          <div class="space-y-1.5">
            <template x-for="p in itemDrawer.provenance" :key="p.provider">
              <div class="flex items-center gap-2 text-body-s">
                <span class="h-1.5 w-1.5 shrink-0 rounded-full"
                      :class="p.status === 'ok' ? 'bg-ok-500' : p.status === 'error' ? 'bg-danger-500' : 'bg-line-strong'"></span>
                <span class="font-medium text-ink" x-text="p.provider"></span>
                <span class="text-ink-faint" x-text="formatDate(p.computed_at)"></span>
                <span x-show="p.stale" class="rounded bg-warn-900/40 px-1.5 text-warn-400"
                      title="The file changed since these facts were computed">stale</span>
                <span x-show="p.reason" class="truncate text-ink-faint" x-text="p.reason"></span>
                <span x-show="p.duration_ms" class="tabular ml-auto text-ink-faint"
                      x-text="`${p.duration_ms}ms`"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Facts -->
        <div class="rounded-lg border border-line bg-sunken p-3">
          <p class="mb-2 text-body-s uppercase tracking-wide text-ink-muted">
            Facts <span class="tabular text-ink-faint" x-text="drawerFacts.length"></span>
          </p>
          <template x-if="!drawerFacts.length">
            <p class="text-body-s text-ink-faint">
              No facts yet — run a scan with the ffprobe provider enabled.
            </p>
          </template>
          <table class="w-full text-body-s">
            <tbody class="divide-y divide-line/60">
              <template x-for="f in drawerFacts" :key="f.key">
                <tr>
                  <td class="py-2.5 pr-3 font-mono text-ink-muted" x-text="f.key"></td>
                  <td class="py-2.5 text-right font-mono text-ink" x-text="formatFactValue(f.value)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>
</div>
