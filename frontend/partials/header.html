<header class="sticky top-0 z-40 border-b border-gray-800 bg-gray-950/95 backdrop-blur">
  <div class="mx-auto flex max-w-[92rem] items-center gap-4 px-4 py-3">

    <div class="flex items-center gap-2.5">
      <span class="text-2xl leading-none">🎞️</span>
      <div>
        <h1 class="font-display text-lg font-bold leading-tight">
          Plex<span class="text-accent-400">lection</span>
        </h1>
        <p class="text-[11px] leading-tight text-gray-500">Collections from facts Plex doesn't have</p>
      </div>
    </div>

    <!-- Tabs -->
    <nav class="ml-4 flex items-center gap-1 overflow-x-auto no-scrollbar">
      <template x-for="t in tabs" :key="t.id">
        <button @click="setTab(t.id)"
                class="whitespace-nowrap rounded-lg px-3 py-1.5 text-sm transition-colors"
                :class="activeTab === t.id
                  ? 'bg-accent-500/15 text-accent-300 ring-1 ring-accent-500/40'
                  : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'">
          <span x-text="t.icon"></span>
          <span class="ml-1" x-text="t.label"></span>
        </button>
      </template>
    </nav>

    <div class="ml-auto flex items-center gap-3">

      <!-- Unmapped-path warning: the number one setup failure mode, so it lives
           in the chrome rather than buried in Settings. -->
      <button x-show="unmappedCount > 0" @click="setTab('settings')"
              class="flex items-center gap-1.5 rounded-lg border border-warn-600/50 bg-warn-900/30 px-2.5 py-1 text-xs text-warn-400 hover:bg-warn-900/50"
              style="display: none;">
        <span>⚠️</span>
        <span><span class="tabular" x-text="unmappedCount"></span> unmapped</span>
      </button>

      <!-- Scan progress, visible from every tab -->
      <div x-show="scanActive" class="flex items-center gap-2 text-xs text-gray-400" style="display: none;">
        <span class="h-2 w-2 animate-pulse rounded-full bg-accent-400"></span>
        <span class="tabular" x-text="`${scanState?.done ?? 0}/${scanState?.total ?? 0}`"></span>
        <div class="h-1.5 w-24 overflow-hidden rounded-full bg-gray-800">
          <div class="h-full rounded-full bg-accent-500 transition-all"
               :style="`width:${Math.round(scanPct * 100)}%`"></div>
        </div>
      </div>

      <!-- SSE liveness -->
      <span class="h-2 w-2 rounded-full"
            :class="sseConnected ? 'bg-ok-500' : 'bg-gray-600'"
            :title="sseConnected ? 'Live updates connected' : 'Live updates disconnected'"></span>

      <button @click="cycleTheme()" title="Change accent"
              class="rounded-lg border border-gray-700 px-2 py-1 text-xs text-gray-400 hover:bg-gray-800">
        <span class="inline-block h-2.5 w-2.5 rounded-full bg-accent-500 align-middle"></span>
      </button>

      <button x-show="loginEnabled" @click="logout()"
              class="rounded-lg border border-gray-700 px-2.5 py-1 text-xs text-gray-400 hover:bg-gray-800"
              style="display: none;">
        Log out
      </button>
    </div>
  </div>
</header>

<!-- Global error banner -->
<div x-show="error" x-cloak class="border-b border-danger-600/50 bg-danger-900/30" style="display: none;">
  <div class="mx-auto flex max-w-[92rem] items-center gap-3 px-4 py-2 text-sm">
    <span>⚠️</span>
    <span class="text-danger-400" x-text="error"></span>
    <button @click="error = null" class="ml-auto text-gray-500 hover:text-gray-300">✕</button>
  </div>
</div>
