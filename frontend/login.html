<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Plexlection</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎞️</text></svg>" />
  <link rel="stylesheet" href="/css/main.css" />
  <script type="module" src="/js/login.js"></script>
</head>
<body class="bg-sunken text-ink min-h-screen antialiased">
  <main class="flex min-h-screen items-center justify-center p-4">
    <div x-data="loginForm" x-cloak
         class="w-full max-w-sm rounded-2xl border border-line bg-surface p-6 shadow-2xl">

      <div class="mb-6 text-center">
        <p class="text-display-l">🎞️</p>
        <h1 class="mt-2 font-display text-display-m font-bold">
          Plex<span class="text-accent-400">lection</span>
        </h1>
        <p class="mt-1 text-body-s text-ink-muted">Sign in to continue</p>
      </div>

      <form @submit.prevent="login()" class="space-y-3">
        <div>
          <label for="username" class="mb-1 block text-body-s text-ink-muted">Username</label>
          <input id="username" type="text" x-model="username" autocomplete="username" required
                 class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2 text-body focus:border-accent-500 focus:outline-none" />
        </div>
        <div>
          <label for="password" class="mb-1 block text-body-s text-ink-muted">Password</label>
          <input id="password" type="password" x-model="password" autocomplete="current-password" required
                 class="w-full rounded-lg border border-line-strong bg-sunken px-3 py-2 text-body focus:border-accent-500 focus:outline-none" />
        </div>

        <p x-show="error" x-cloak class="rounded-lg bg-danger-900/40 px-3 py-2 text-body-s text-danger-400"
           x-text="error" style="display: none;"></p>

        <button type="submit" :disabled="busy"
                class="w-full rounded-lg bg-accent-600 px-4 py-2 text-body font-medium text-white hover:bg-accent-500 disabled:opacity-50">
          <span x-text="busy ? 'Signing in…' : 'Sign in'"></span>
        </button>
      </form>
    </div>
  </main>
</body>
</html>
