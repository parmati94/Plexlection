[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

# autorestart=false so a syntax error during --reload leaves the container up
# with a readable traceback instead of crash-looping.
[program:backend]
command=python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 --reload --reload-dir /app/backend
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
