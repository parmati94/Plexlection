[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

# autorestart=false so a syntax error during --reload leaves the container up
# with a readable traceback instead of crash-looping.
[program:backend]
# --timeout-graceful-shutdown is required, not a nicety: the SSE stream at
# /api/events never closes on its own, so an open browser tab makes uvicorn's
# reload hang forever on "Waiting for connections to close" and the app never
# comes back. Any backend edit with the UI open would wedge the container.
command=python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 --reload --reload-dir /app/backend --timeout-graceful-shutdown 3
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
